name: Release

# Manual trigger: Actions → Release → "Run workflow", entering the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0) — creates the tag v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write  # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Inputs go through environment variables, never interpolated straight into scripts.
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: '$VERSION' (use something like 1.2.3)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Stamp the version into the script
        run: |
          sed -i "s/^APP_VERSION = \"dev\"/APP_VERSION = \"$VERSION\"/" discord_normalizer.py
          grep -q "^APP_VERSION = \"$VERSION\"" discord_normalizer.py

      - name: Check that the script imports
        run: python -c "import discord_normalizer as d; print(d.APP_NAME, d.APP_VERSION)"

      - name: Build the icon
        run: >
          python -c "import discord_normalizer as d;
          d.make_icon_image(256).save('normie.ico',
          sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"

      - name: Build the .exe
        # pystray picks its backend at runtime, so PyInstaller can't see it on its own.
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name normie --icon normie.ico
          --hidden-import pystray._win32
          discord_normalizer.py

      - name: Collect release files
        run: |
          mkdir -p release
          cp dist/normie.exe release/normie.exe
          cp discord_normalizer.py release/normie.py
          cp requirements.txt release/requirements.txt
          cd release && sha256sum normie.exe normie.py requirements.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Normie $TAG" \
            --generate-notes \
            "${flags[@]}"
